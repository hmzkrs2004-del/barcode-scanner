<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>バーコード読み取り</title>
<script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body style="font-family:sans-serif;text-align:center;padding:16px">
<h2>バーコード読み取り</h2>
<div id="reader" style="width:100%;max-width:500px;margin:auto"></div>
<p id="result">読み取り待機中</p>
<button onclick="startScan()">読み取り開始</button>
<button onclick="stopScan()">停止</button>
<script>
let scanner;
function startScan() {
  scanner = new Html5Qrcode("reader");
  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 280, height: 120 } },
    code => {
      document.getElementById("result").textContent = "読み取り成功：" + code;
    },
    () => {}
  ).catch(err => {
    document.getElementById("result").textContent = "カメラエラー：" + err;
  });
}
function stopScan() {
  if (scanner && scanner.isScanning) scanner.stop();
}
</script>
</body>
<button onclick="copyJAN()">JANコードをコピー</button>
<script>
function copyJAN() {
  const text = document.getElementById("result").textContent;
  const jan = text.replace("読み取り成功：", "");
  if (!jan || jan === text) {
    alert("先にバーコードを読み取ってください");
    return;
  }
  navigator.clipboard.writeText(jan).then(() => {
    alert("JANコードをコピーしました");
  }).catch(() => {
    alert("コピーできませんでした");
  });
}
  </html>
